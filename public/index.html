<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>听纹修复</title><link rel="stylesheet" href="/style.css"><script type="module" src="/js/main.mjs"></script><script type="module" src="/js/flats/workflow.mjs"></script></head>
<body><main><header><div><h1>听纹修复</h1><p id="source-info">打开录音查看频谱</p></div><div class="actions">
<label>导入 PCM WAV<input id="file" type="file" accept=".wav,audio/wav"></label><button id="demo">打开内置录音</button></div></header>
<section id="flattop-lab" class="flattop-lab" aria-label="平顶检查与补峰">
<h2>平顶检查 · 圈时段 / 按声道选定补峰对象</h2>
<div class="flat-toolbar">
<label>导入访谈 WAV<input id="flat-file" type="file" accept=".wav,audio/wav"></label>
<button id="flat-demo" type="button">内置访谈录音</button>
<label>圈选开始 / 秒<input id="circle-start" type="number" step="any" placeholder="0"></label>
<label>圈选结束 / 秒<input id="circle-end" type="number" step="any" placeholder="3"></label>
<button id="scan-circle" type="button" class="primary">检查此时段</button>
<button id="scan-all" type="button">检查全段</button>
<label class="select-all"><input id="select-all-flats" type="checkbox">全选当前可补平顶</label>
<button id="repair-selected" type="button" class="primary" disabled>修复选中对象并生成成品</button>
</div>
<p class="flat-hint">在任一声道波形上横向拖出“圈线”即可圈出检查时段；圈线碰到平顶中段也会认出整段，同一平顶只作为一个修复对象，不会拆修。单个满幅样点记为瞬态、不算平顶；边界平顶缺少一侧有效波形，只列为证据不足、不得补峰。</p>
<div id="waveforms" class="waveforms"></div>
<div id="channel-panels" class="channel-panels"></div>
<div class="flat-listen listen">
<div role="group" aria-label="原声与成品对听"><button id="flat-original" type="button" aria-pressed="true">原声</button><button id="flat-result" type="button" aria-pressed="false" disabled>成品</button></div>
<audio id="flat-audio" controls preload="metadata"></audio>
<button id="flat-download" type="button" disabled>下载成品 WAV</button>
</div>
<p id="flat-product-info" class="product-info"></p>
<p id="flat-status" role="status" class="flat-status"></p>
</section>
<section class="work"><h2>频谱</h2><div class="spectrum"><span id="max-freq"></span><div class="layers"><canvas id="plot" width="900" height="290" aria-label="录音的时间频率图"></canvas><canvas id="mask" width="900" height="290" aria-label="拖动以填充选区范围"></canvas></div><div class="axis"><span>0 秒</span><span id="max-time"></span></div></div>
<div class="listen"><div role="group" aria-label="对听信号"><button id="original" aria-pressed="true" disabled>原声</button><button id="result" aria-pressed="false" disabled>修复</button></div><audio controls preload="metadata"></audio><button id="export" disabled>导出 WAV</button></div></section>
<section class="edit"><div><h2>频谱选区</h2><form><label>窗长<select name="size"><option>256</option><option selected>512</option><option>1024</option></select></label>
<label>开始 / 秒<input name="start" type="number" step="any" required></label><label>结束 / 秒<input name="end" type="number" step="any" required></label><label>低频 / 赫兹<input name="low" type="number" step="any" required></label><label>高频 / 赫兹<input name="high" type="number" step="any" required></label><label>衰减 / dB<input name="db" type="number" step="any" value="18" required></label><button id="add" disabled>添加选区</button></form></div>
<div class="render"><ul id="regions"></ul><button id="apply" class="primary" disabled>生成修复</button><p id="status" role="status"></p><p id="metrics"></p></div></section></main></body></html>
